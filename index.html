  <style>
    :root{--bg:#07111f;--panel:#0d1a2d;--text:#f4f8ff;--muted:#aab8ce;--line:#263954;--blue:#5b8cff;--purple:#9b7bff;--green:#32d296}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 14% 10%,rgba(91,140,255,.16),transparent 32%),radial-gradient(circle at 84% 18%,rgba(155,123,255,.13),transparent 30%),radial-gradient(circle at 60% 90%,rgba(50,210,150,.09),transparent 32%),var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.65}
    a{color:inherit}.container{width:min(1120px,calc(100% - 32px));margin:auto}.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08)}.brand{font-weight:900;letter-spacing:.02em}.repo{font-size:14px;color:var(--muted);text-decoration:none}.hero{padding:110px 0 72px}.eyebrow{display:inline-flex;padding:7px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:13px;font-weight:800}.hero h1{max-width:920px;margin:22px 0 18px;font-size:clamp(52px,8vw,96px);line-height:1;letter-spacing:-.055em}.hero p{max-width:720px;margin:0;color:var(--muted);font-size:clamp(18px,2.2vw,23px)}.topics{padding:30px 0 92px}.section-title{margin:0 0 24px;font-size:30px}.card{display:grid;grid-template-columns:1.2fr .8fr;gap:30px;padding:34px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.025));box-shadow:0 24px 70px rgba(0,0,0,.25);text-decoration:none;transition:.25s ease}.card:hover{transform:translateY(-4px);border-color:#46628a}.tag{display:inline-flex;color:#b8c7dc;font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.card h2{margin:10px 0 12px;font-size:clamp(30px,4vw,48px);line-height:1.08;letter-spacing:-.035em}.card p{margin:0;color:var(--muted);font-size:18px}.visual{min-height:260px;border:1px solid var(--line);border-radius:22px;background:#091526;display:grid;place-items:center;position:relative;overflow:hidden}.visual:before,.visual:after{content:"";position:absolute;border-radius:50%;filter:blur(55px)}.visual:before{width:190px;height:190px;background:var(--blue);opacity:.25;left:12%;top:22%}.visual:after{width:160px;height:160px;background:var(--green);opacity:.18;right:8%;bottom:8%}.trio{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:82%}.pill{padding:18px 8px;text-align:center;border-radius:16px;border:1px solid rgba(255,255,255,.13);background:rgba(13,26,45,.86);font-weight:900}.pill:nth-child(1){border-top:3px solid var(--blue)}.pill:nth-child(2){border-top:3px solid var(--purple)}.pill:nth-child(3){border-top:3px solid var(--green)}footer{padding:34px 0 48px;color:var(--muted);font-size:14px}@media(max-width:780px){.card{grid-template-columns:1fr}.hero{padding-top:76px}.visual{min-height:210px}.repo{display:none}}
  </style>
</head>
<body>

    <main>

    </main>
    <footer>AI Sharing · Maintained by xinhailxq</footer>
